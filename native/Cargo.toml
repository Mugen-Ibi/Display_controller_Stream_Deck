[package]
name = "display-ddc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
authors = ["Mugen Ibi"]
repository = "https://github.com/Mugen-Ibi/Display_controller_Stream_Deck"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Devices_Display", "Win32_System_Registry"] }

[profile.release]
lto = true
strip = true
panic = "abort"
