name: Verify and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: rustup update stable
      - run: npm ci
      - run: npm run check
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: display-controller
          path: dist/*.streamDeckPlugin
